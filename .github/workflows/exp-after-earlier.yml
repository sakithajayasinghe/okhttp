name: exp-after-earlier
on:
  push:
    branches: ["exp/after-earlier"]

jobs:
  launcher:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [alone, after-doublePushPromise, after-clientPingsServer, twice]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Build and prepare the launcher
        run: |
          mvn -B -q -pl okhttp-tests -am install -DskipTests \
            -Dcheckstyle.skip=true -Danimal.sniffer.skip=true -Dmaven.javadoc.skip=true
          mvn -B -q -pl okhttp-tests dependency:build-classpath -Dmdep.outputFile="$PWD/cp.txt"
          mkdir -p launcher
          javac -cp "$(cat cp.txt)" -d launcher tools/Seq4.java
      - name: Run the experiment 30 times
        run: |
          C=com.squareup.okhttp.internal.spdy.SpdyConnectionTest
          case "${{ matrix.variant }}" in
            alone)                   TESTS="$C#pushPromiseStream" ;;
            after-doublePushPromise) TESTS="$C#doublePushPromise $C#pushPromiseStream" ;;
            after-clientPingsServer) TESTS="$C#clientPingsServer $C#pushPromiseStream" ;;
            twice)                   TESTS="$C#pushPromiseStream $C#pushPromiseStream" ;;
          esac
          fails=0
          for i in $(seq 1 30); do
            java -cp "launcher:okhttp-tests/target/test-classes:$(cat cp.txt)" Seq4 $TESTS > run.txt || true
            cat run.txt
            if tail -1 run.txt | grep -q 'failed=1'; then fails=$((fails+1)); fi
          done
          echo "${{ matrix.variant }} (job ${{ matrix.attempt }}): pushPromiseStream failed $fails of 30" \
            | tee -a "$GITHUB_STEP_SUMMARY"
